# Dependabot version updates.
#
# Why this file exists: every one of the 36 npm security alerts open in July 2026
# was a *transitive* dependency of a stale pnpm-lock.yaml, not a vulnerable direct
# dependency. Nothing was opening bump PRs, so the lockfile drifted for months
# while the manifests stayed permissive enough to have resolved the fixes on their
# own. Keeping the lockfile moving is what stops that from recurring.
#
# Security updates are a separate, always-on GitHub feature and do not need to be
# listed here. This file only adds the routine version updates, plus the grouping
# that keeps both kinds of PR reviewable.

version: 2

updates:
  # --- JavaScript: one entry covers the whole pnpm workspace -----------------
  # Dependabot reads pnpm-workspace.yaml from the root, so packages/*, docs and
  # the catalog are all in scope without separate entries per package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Only widen a range when the new version actually falls outside it. The
    # default (`increase`) rewrites every manifest range on every bump, which is
    # pure churn for a library whose ranges are deliberately permissive.
    versioning-strategy: increase-if-necessary
    groups:
      # These move as a unit. deck.gl, luma.gl, loaders.gl and viv share peer
      # ranges, and bumping one without the others produces a tree that installs
      # cleanly but breaks at runtime on mismatched GL context internals.
      deckgl-stack:
        patterns:
          - 'deck.gl'
          - '@deck.gl/*'
          - '@luma.gl/*'
          - '@loaders.gl/*'
          - '@math.gl/*'
          - '@hms-dbmi/viv'
          - '@vivjs/*'
      # Docusaurus drags in the entire webpack build stack, which is where most
      # of the historical alert noise came from. Keeping it in one PR means one
      # `pnpm docs:build` verifies the lot.
      docs-stack:
        patterns:
          - '@docusaurus/*'
          - '@mdx-js/*'
          - 'prism-react-renderer'
      # Everything else, split so a dev-tooling bump never sits behind a runtime
      # one in review.
      #
      # The `exclude-patterns` below are what make the two stack groups above
      # work at all. Between them these groups match `dependency-type: production`
      # and `dependency-type: development`, which is every dependency there is.
      # The documented rule is that the first matching group wins and both stack
      # groups are declared first, but that is not the observed behaviour: in
      # practice these two claimed everything, and neither `deckgl-stack` nor
      # `docs-stack` had opened a single PR in the lifetime of this file.
      #
      # Docusaurus 3.10.2 is what exposed it. `@docusaurus/core` and
      # `preset-classic` are runtime deps of docs/ and went to production; the
      # matching `types`, `tsconfig` and `module-type-aliases` are dev deps and
      # went to development. Two PRs (#123, #124), each mergeable alone, each
      # leaving the docs site half-upgraded — precisely what `docs-stack` was
      # written to prevent. On the deck.gl side the same split is worse than
      # cosmetic; see the note above that group.
      #
      # An exclusion has to be listed here for every pattern in a stack group,
      # in both of these groups. If a pattern is added above and not in both
      # lists below, that group silently stops claiming it and the dependency is
      # quietly absorbed back into these two. The lists are spelled out rather
      # than shared through a YAML anchor on purpose: dependabot-core is Ruby,
      # and `YAML.safe_load` rejects aliases with `Psych::BadAlias` unless the
      # caller opts in. Whether it does is not something this file should bet on
      # — a parse error here disables every update in the repository.
      #
      # Majors are deliberately excluded from both groups so they arrive as
      # individual PRs. A group is a single merge decision, and a batch is only
      # worth reviewing as one if every member is safe to take on the same
      # evidence — a green CI run. That holds for minor/patch; it does not hold
      # for a major, which needs its own judgement and would otherwise hold the
      # whole batch hostage while it is being made. (The August 2026 batch put
      # a geotiff 2 -> 3 major, which viv cannot yet take, in the same PR as
      # eight uncontroversial bumps.) Security updates are unaffected: they are
      # matched by the `security-updates` group below, which stays unrestricted.
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          # deckgl-stack
          - 'deck.gl'
          - '@deck.gl/*'
          - '@luma.gl/*'
          - '@loaders.gl/*'
          - '@math.gl/*'
          - '@hms-dbmi/viv'
          - '@vivjs/*'
          # docs-stack
          - '@docusaurus/*'
          - '@mdx-js/*'
          - 'prism-react-renderer'
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          # deckgl-stack
          - 'deck.gl'
          - '@deck.gl/*'
          - '@luma.gl/*'
          - '@loaders.gl/*'
          - '@math.gl/*'
          - '@hms-dbmi/viv'
          - '@vivjs/*'
          # docs-stack
          - '@docusaurus/*'
          - '@mdx-js/*'
          - 'prism-react-renderer'
      # Security fixes arrive outside the weekly cadence; batch them so a sweep
      # like the one this file was written for is a single PR, not thirty-six.
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # The TypeScript setup here is a deliberate two-package arrangement:
      # `typescript` is aliased to the TS 6 compat package because TS 7 (the
      # native port) ships no JS API and breaks typescript-eslint, while
      # `@typescript/native` supplies the TS 7 tsc used by the build scripts.
      # Majors have to be migrated by hand, not merged.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@typescript/native'
        update-types: [version-update:semver-major]

  # --- GitHub Actions --------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'

  # --- Python: the reader/writer utility package -----------------------------
  - package-ecosystem: uv
    directory: /python/spatialdata-js-util
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns:
          - '*'

  # --- Python: the spatialdata version matrix --------------------------------
  # Each of these directories pins one exact spatialdata release so the fixture
  # generator can emit stores in that version's on-disk layout. Their transitive
  # deps still need patching (the open setuptools alerts live here), but the pin
  # itself is the entire point of the directory and must never be bumped.
  #
  # Split in two only because of the setuptools cap below. The two entries are
  # otherwise identical, and anything that changes one should change both.
  - package-ecosystem: uv
    directories:
      - /python/v0.7.2
      - /python/v0.8.0
    schedule:
      interval: weekly
      day: monday
    groups:
      fixtures:
        patterns:
          - '*'
    ignore:
      - dependency-name: spatialdata

  # The older two releases cap setuptools below 81, which removed `pkg_resources`
  # while their dependency stack still imports it at runtime — see the comment in
  # each pyproject.toml. That comment is not something Dependabot reads, and its
  # default versioning strategy widens a declared constraint to admit the version
  # it wants: in #112 it rewrote `<81` to `<84`, leaving the paragraph explaining
  # the cap sitting directly above the line that now contradicted it. CI caught
  # it, but only after the fixture build died on the missing `pkg_resources`.
  #
  # `versioning-strategy: lockfile-only` is the tempting fix and the wrong one.
  # It would leave the cap alone, but for uv it also stops transitive updates
  # (dependabot-core#14073) — and receiving those is what these directories are
  # here for. Ignoring the one dependency keeps the rest of the stack moving.
  #
  # v0.7.2 and v0.8.0 are deliberately excluded: both already run setuptools 83
  # uncapped, so this rule would pin them there for good, security fixes included.
  - package-ecosystem: uv
    directories:
      - /python/v0.5.0
      - /python/v0.6.1
    schedule:
      interval: weekly
      day: monday
    groups:
      fixtures:
        patterns:
          - '*'
    ignore:
      - dependency-name: spatialdata
      - dependency-name: setuptools
        versions: ['>=81']
