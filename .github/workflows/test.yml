name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Enforces React Hooks / React Compiler (Rules-of-React) compliance for the
    # React-shipping packages via eslint-plugin-react-hooks. The backlog has been
    # cleared, so this is a required gate: any new finding fails the check.
    steps:
      # Every step in this file carries a distinct `name:`. Four jobs check out
      # with byte-identical `uses:` blocks, so unnamed steps give reviewers (and
      # tools applying line-anchored review suggestions) no way to tell them
      # apart — that ambiguity is how a duplicate `with:` key landed in this job
      # in #92 and broke the whole workflow.
      - name: Check out repository (react-lint)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint React packages (react-hooks / react-compiler rules)
        run: pnpm lint:react

  biome-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Biome lint/format gate over the library source (packages/*/src). The error
    # backlog there has been cleared, so `biome ci` fails on any new error.
    # noExplicitAny is configured as a non-blocking warning. Demo, scripts, and
    # tests are intentionally out of scope (still carry findings), so this gate is
    # narrower than `pnpm lint` (biome check .).
    steps:
      - name: Check out repository (biome-lint)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint/format (packages/*/src)
        run: pnpm lint:biome

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (test)
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: 'pnpm'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vendor OpenJPH for spatialdata-js-util
        run: node scripts/vendor-openjph-for-python.mjs

      - name: Build packages
        run: pnpm build

      # Fixtures rarely change, so cache the generated output and only regenerate
      # when the generation code or its pinned deps change. Each version is cached
      # SEPARATELY, keyed on the orchestrator plus that version's own script +
      # pyproject.toml + uv.lock. One cache over the whole matrix would mean
      # touching any single version re-ran all of them, and generation is the
      # expensive part: ~70s per version, against ~2s for its `uv sync` (uv's own
      # download cache is handled by astral-sh/setup-uv, not here). Per-version
      # keys make a change cost one regeneration rather than the whole matrix,
      # which is what keeps adding a release cheap.
      #
      # Exact-match keys, no restore-keys: a changed generator must regenerate
      # rather than restore a stale store. Keep these steps in step with
      # FIXTURE_VERSIONS in tests/integration/fixtureVersions.ts.
      - name: Cache generated test fixtures (0.5.0)
        id: cache-fixtures-050
        uses: actions/cache@v6
        with:
          path: test-fixtures/v0.5.0
          key: ${{ runner.os }}-fixtures-v0.5.0-${{ hashFiles('python/scripts/generate_fixtures.py', 'python/v0.5.0/**') }}

      - name: Generate test fixtures (Python spatialdata 0.5.0)
        if: steps.cache-fixtures-050.outputs.cache-hit != 'true'
        run: pnpm test:fixtures:generate:0.5.0

      - name: Cache generated test fixtures (0.6.1)
        id: cache-fixtures-061
        uses: actions/cache@v6
        with:
          path: test-fixtures/v0.6.1
          key: ${{ runner.os }}-fixtures-v0.6.1-${{ hashFiles('python/scripts/generate_fixtures.py', 'python/v0.6.1/**') }}

      - name: Generate test fixtures (Python spatialdata 0.6.1)
        if: steps.cache-fixtures-061.outputs.cache-hit != 'true'
        run: pnpm test:fixtures:generate:0.6.1

      - name: Cache generated test fixtures (0.7.2)
        id: cache-fixtures-072
        uses: actions/cache@v6
        with:
          path: test-fixtures/v0.7.2
          key: ${{ runner.os }}-fixtures-v0.7.2-${{ hashFiles('python/scripts/generate_fixtures.py', 'python/v0.7.2/**') }}

      - name: Generate test fixtures (Python spatialdata 0.7.2)
        if: steps.cache-fixtures-072.outputs.cache-hit != 'true'
        run: pnpm test:fixtures:generate:0.7.2

      # Same path and key as the production-browser job's cache, deliberately:
      # both jobs want the same 0.8.0 blobs store, so whichever runs first
      # populates it and the other hits instead of generating it a second time.
      - name: Cache generated test fixtures (0.8.0)
        id: cache-fixtures-080
        uses: actions/cache@v6
        with:
          path: test-fixtures/v0.8.0
          key: ${{ runner.os }}-fixtures-v0.8.0-${{ hashFiles('python/scripts/generate_fixtures.py', 'python/v0.8.0/**') }}

      - name: Generate test fixtures (Python spatialdata 0.8.0)
        if: steps.cache-fixtures-080.outputs.cache-hit != 'true'
        run: pnpm test:fixtures:generate:0.8.0

      # The codec fixtures are generated on demand by codecFixtures.test.ts during
      # the integration run, not by a step here. The old single `test-fixtures`
      # cache therefore picked them up by accident — restored, but keyed on the
      # *blobs* generators, so a codec-generator change did not invalidate them.
      # Caching them explicitly keeps the saving and fixes the key.
      - name: Cache generated codec fixtures
        uses: actions/cache@v6
        with:
          path: test-fixtures/codecs
          key: ${{ runner.os }}-fixtures-codecs-${{ hashFiles('scripts/vendor-openjph-for-python.mjs', 'python/spatialdata-js-util/scripts/**', 'python/spatialdata-js-util/src/**', 'python/spatialdata-js-util/pyproject.toml', 'python/spatialdata-js-util/uv.lock') }}

      - name: Run spatialdata-js-util tests
        run: uv run --directory python/spatialdata-js-util --extra write --extra tui pytest

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests with local server
        shell: bash
        run: |
          # Verify fixtures exist before starting server
          if [ ! -d "test-fixtures/v0.5.0/blobs.zarr" ]; then
            echo "Error: Fixtures not found at test-fixtures/v0.5.0/blobs.zarr"
            echo "Listing test-fixtures directory:"
            ls -la test-fixtures/ || echo "test-fixtures directory does not exist"
            exit 1
          fi
          
          # Start test server in background
          pnpm test:server &
          SERVER_PID=$!

          # Wait for server to be ready (up to ~30s)
          # Check both root and a fixture path to ensure server is fully ready
          for _ in {1..30}; do
            if curl -sSf http://localhost:38473/ >/dev/null && \
               curl -sSf http://localhost:38473/v0.5.0/blobs.zarr/zmetadata >/dev/null; then
              echo "Test server is up and serving fixtures"
              break
            fi
            echo "Waiting for test server on http://localhost:38473/ ..."
            sleep 1
          done

          # Small additional delay to ensure server is fully ready
          sleep 2

          # Run integration tests (will hit http://localhost:38473/…)
          pnpm test:integration

          # Clean up server
          kill "$SERVER_PID" || true

  production-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository (production-browser)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          cache: 'pnpm'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same path and key as the `test` job's 0.8.0 cache. This job only needs a
      # v0.8.0 blobs store, which is exactly what that job already builds, so
      # sharing the entry means the store is generated once per key rather than
      # once per job. Whichever job runs first populates it; on a cold cache both
      # may generate, which actions/cache tolerates (the second save is a no-op).
      #
      # Generating straight into test-fixtures/ is also why there is no longer a
      # symlink step: the browser consumer serves /test-fixtures/v0.8.0/... and
      # now finds it in place.
      - name: Cache generated production browser fixtures (0.8.0)
        id: cache-production-browser-fixtures
        uses: actions/cache@v6
        with:
          path: test-fixtures/v0.8.0
          key: ${{ runner.os }}-fixtures-v0.8.0-${{ hashFiles('python/scripts/generate_fixtures.py', 'python/v0.8.0/**') }}

      - name: Generate test fixtures (Python spatialdata 0.8.0)
        if: steps.cache-production-browser-fixtures.outputs.cache-hit != 'true'
        run: pnpm test:fixtures:generate:0.8.0

      - name: Install Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and browser-test the production browser consumer
        run: pnpm test:browser:production

      - name: Upload production browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-artifacts
          path: test-results
          if-no-files-found: ignore
