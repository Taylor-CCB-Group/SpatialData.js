packages:
  - packages/*
  - docs

allowBuilds:
  '@biomejs/biome': false
  '@vaadin/vaadin-usage-statistics': false
  core-js: false
  core-js-pure: false

# Force patched versions of vulnerable transitive deps that are pinned deep in the
# Docusaurus docs-site build stack (dev-only, not shipped). Ranges target only the
# vulnerable versions so intentional other-major installs are left untouched.
# caniuse-lite is bumped to silence the stale browserslist data warning.
overrides:
  caniuse-lite: ^1.0.30001805
  'shell-quote@>=1.0.0 <1.8.4': ^1.8.4
  'ws@>=7.0.0 <7.5.11': ^7.5.11
  'ws@>=8.0.0 <8.21.0': ^8.21.0
  'fast-uri@>=3.0.0 <3.1.4': ^3.1.4
  '@babel/plugin-transform-modules-systemjs@>=7.0.0 <7.29.4': ^7.29.4
  'lodash@>=4.0.0 <4.18.0': ^4.18.0
  'minimatch@>=3.0.0 <3.1.3': ^3.1.3
  'node-forge@>=1.0.0 <1.4.0': ^1.4.0
  'path-to-regexp@<0.1.13': 0.1.13
  'preact@>=10.27.0 <10.27.3': ^10.27.3
  'rollup@>=4.0.0 <4.59.0': ^4.59.0
  'svgo@>=3.0.0 <3.3.3': ^3.3.3
  # sockjs (via webpack-dev-server) pins uuid ^8.3.2. GHSA only affects the v3/v5/v6
  # external-buffer path; sockjs calls v4, so this is hygiene rather than exposure.
  'uuid@<11.1.1': ^11.1.1
  # copy-webpack-plugin@11 pins serialize-javascript ^6; v7 is a drop-in (CJS, Node >=20).
  'serialize-javascript@<7.0.5': ^7.0.5
  # Not a CVE: webpack >=5.106 moved ProgressPlugin option validation into apply(),
  # which rejects webpackbar 6's subclassed options and breaks `pnpm docs:build`.
  # webpackbar 7 is schema-clean, so we can stay on patched webpack instead of pinning back.
  'webpackbar@>=6.0.0 <7.0.0': ^7.0.0
  # Shipped transitives (deck.gl / loaders.gl), not docs-only. Consumers of the published
  # packages already resolve these fresh through caret ranges; these overrides only unstick
  # our own lockfile so the alerts close.
  'fast-xml-parser@>=5.0.0 <5.10.1': ^5.10.1
  'protocol-buffers-schema@<3.6.1': ^3.6.1

catalog:
  '@zarrita/storage': ^0.2.0
  '@rolldown/plugin-babel': ^0.2.3
  babel-plugin-react-compiler: ^1.0.0
  '@deck.gl/aggregation-layers': ~9.3.7
  '@deck.gl/arcgis': ~9.3.7
  '@deck.gl/core': ~9.3.7
  '@deck.gl/extensions': ~9.3.7
  '@deck.gl/geo-layers': ~9.3.7
  '@deck.gl/google-maps': ~9.3.7
  '@deck.gl/layers': ~9.3.7
  '@deck.gl/mapbox': ~9.3.7
  '@deck.gl/mesh-layers': ~9.3.7
  '@deck.gl/react': ~9.3.7
  '@deck.gl/widgets': ~9.3.7
  '@loaders.gl/core': ~4.4.3
  '@luma.gl/constants': ~9.3.6
  '@luma.gl/core': ~9.3.6
  '@luma.gl/engine': ~9.3.6
  '@luma.gl/gltf': ~9.3.6
  '@luma.gl/shadertools': ~9.3.6
  '@luma.gl/webgl': ~9.3.6
  '@math.gl/core': ^4.1.0
  '@types/node': ^22.10.5
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^6.0.1
  '@hms-dbmi/viv': ^0.22.0
  '@vivjs/constants': 0.22.0
  '@vivjs/views': 0.22.0
  anndata.js: ^0.0.2
  apache-arrow: ^21.2.0
  deck.gl: ~9.3.7
  react: ^19.2.1
  react-dom: ^19.2.1
  # TypeScript 7.0 (the native port) ships no JS API, so tools that use the compiler
  # API (typescript-eslint) resolve the literal `typescript` to the TS 6 compat package,
  # while `@typescript/native` provides the TS 7 `tsc` used by the build scripts.
  typescript: 'npm:@typescript/typescript6@^6.0.2'
  '@typescript/native': 'npm:typescript@^7.0.2'
  vite: ^8.0.16
  vitest: ^4.1.4
  zarrita: ^0.7.1
  zod: ^4.1.13
  jsdom: ^30.0.1
